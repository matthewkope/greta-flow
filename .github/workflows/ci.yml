name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Select Xcode 26.3 and Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain
      # mlx-swift (greta-summarizer) needs Swift 6.3+; install the signed
      # swift.org 6.4.2 toolchain for the runner user only.
      - name: Install Swift 6.4.2 toolchain
        working-directory: .
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/swift-6.4.2-RELEASE-osx.pkg"
          curl -fsSL --retry 3 -o "$pkg" \
            https://download.swift.org/swift-6.4.2-release/xcode/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-osx.pkg
          echo "0a7d8489900d21dbf5f0187cb570e646a4c0226d0ddef2cbde8c7f54dfe79736  $pkg" | shasum -a 256 -c -
          pkgutil --check-signature "$pkg" | tee "$RUNNER_TEMP/swift-pkg-signature.txt"
          grep -F "Developer ID Installer: Swift Open Source (V9AUD2URP3)" "$RUNNER_TEMP/swift-pkg-signature.txt"
          installer -target CurrentUserHomeDirectory -pkg "$pkg"
          toolchain="$HOME/Library/Developer/Toolchains/swift-6.4.2-RELEASE.xctoolchain"
          toolchains_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$toolchain/Info.plist")
          echo "TOOLCHAINS=$toolchains_id" >> "$GITHUB_ENV"
          TOOLCHAINS="$toolchains_id" swift --version
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Distribution checks
        run: |
          bash -n ../../install.sh
          python3 -m unittest discover -s ../../tools/distribution -v
          ruby -c ../../Casks/greta-flow.rb
          brew style ../../Casks/greta-flow.rb
      - name: Build Parakeet runtime
        run: ../scripts/build-parakeet.sh
      - name: Test
        run: cargo test --locked --all-targets
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Build DMG for installation checks (ad-hoc signed)
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles dmg
      - name: Check installer and cask against built DMG
        run: |
          version=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          python3 ../../tools/distribution/check_built_dmg.py \
            --dmg "target/release/bundle/dmg/Greta Flow_${version}_aarch64.dmg"

  python:
    runs-on: macos-15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install PortAudio
        run: brew install portaudio
      - name: Sync dependencies
        run: uv sync
      - name: Build source distribution and wheel
        run: uv build
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -v
